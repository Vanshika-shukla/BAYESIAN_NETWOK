<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Grade Bayesian Network</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="main-wrapper">
  <div class="left-panel">
    <div class="container">
      <h2>Student Grade Bayesian Network</h2>

      <label>Probability Type:</label>
      <select id="probType">
        <option value="joint">Joint Probability</option>
        <option value="marginal">Marginal Probability</option>
        <option value="conditional">Conditional Probability</option>
      </select>

      <label>Variable 1:</label>
      <select id="var1">
        <option value="PreviousPerformance">PreviousPerformance</option>
        <option value="StudyHours">StudyHours</option>
        <option value="Attendance">Attendance</option>
        <option value="Understanding">Understanding</option>
        <option value="Grade">Grade</option>
      </select>

      <label>Value 1:</label>
      <select id="val1">
        <!-- Options filled by JS -->
      </select>

      <label id="var2Label">Variable 2:</label>
      <select id="var2" style="display: none;">
        <option value="PreviousPerformance">PreviousPerformance</option>
        <option value="StudyHours">StudyHours</option>
        <option value="Attendance">Attendance</option>
        <option value="Understanding">Understanding</option>
        <option value="Grade">Grade</option>
      </select>

      <label id="val2Label">Value 2:</label>
      <select id="val2" style="display: none;">
        <!-- Options filled by JS -->
      </select>

      <label id="var3Label">Variable 3:</label>
      <select id="var3" style="display: none;">
        <option value="PreviousPerformance">PreviousPerformance</option>
        <option value="StudyHours">StudyHours</option>
        <option value="Attendance">Attendance</option>
        <option value="Understanding">Understanding</option>
        <option value="Grade">Grade</option>
      </select>

      <label id="val3Label">Value 3:</label>
      <select id="val3" style="display: none;">
        <!-- Options filled by JS -->
      </select>

      <label id="condVar1Label">Condition Variable 1:</label>
      <select id="condVar1" style="display: none;">
        <option value="PreviousPerformance">PreviousPerformance</option>
        <option value="StudyHours">StudyHours</option>
        <option value="Attendance">Attendance</option>
        <option value="Understanding">Understanding</option>
        <option value="Grade">Grade</option>
      </select>

      <label id="condVal1Label">Condition Value 1:</label>
      <select id="condVal1" style="display: none;">
        <!-- Options filled by JS -->
      </select>

      <button onclick="calculate()">Calculate</button>

      <div class="result" id="result">
        Result will appear here...
      </div>
    </div>
  </div>

  <div class="table-section">
    <h3>Probability Tables</h3>
    <div id="tableContainer" class="table-wrapper">
    </div>
    
    <div class="dag-container">
      <h3>Bayesian Network DAG</h3>
      <svg width="100%" height="100%" viewBox="0 0 520 320" style="min-height: 260px;">
        <!-- Background -->
        <defs>
          <linearGradient id="dagBgStudent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#D5F3D8;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect width="520" height="320" fill="url(#dagBgStudent)"/>

        <!-- Nodes -->
        <!-- Previous Performance (Top Left) -->
        <circle cx="110" cy="70" r="45" fill="#F2C7C7" stroke="#ffffff" stroke-width="2.5"/>
        <text x="110" y="64" text-anchor="middle" fill="#333333" font-weight="700" font-size="13">Previous</text>
        <text x="110" y="82" text-anchor="middle" fill="#333333" font-weight="700" font-size="13">Performance</text>

        <!-- Study Hours (Middle Left) -->
        <circle cx="110" cy="185" r="40" fill="#FFB7C5" stroke="#ffffff" stroke-width="2.5"/>
        <text x="110" y="179" text-anchor="middle" fill="#333333" font-weight="700" font-size="13">Study</text>
        <text x="110" y="197" text-anchor="middle" fill="#333333" font-weight="700" font-size="13">Hours</text>

        <!-- Attendance (Bottom Left) -->
        <circle cx="110" cy="270" r="38" fill="#F2C7C7" stroke="#ffffff" stroke-width="2.5"/>
        <text x="110" y="274" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="700" font-size="14">Attendance</text>

        <!-- Understanding (Center Right) -->
        <circle cx="320" cy="135" r="48" fill="#D5F3D8" stroke="#ffffff" stroke-width="2.5"/>
        <text x="320" y="139" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="700" font-size="13">Understanding</text>

        <!-- Grade (Right) -->
        <circle cx="440" cy="230" r="40" fill="#FFB7C5" stroke="#ffffff" stroke-width="2.5"/>
        <text x="440" y="234" text-anchor="middle" dominant-baseline="middle" fill="#333333" font-weight="700" font-size="14">Grade</text>

        <!-- Arrowheads -->
        <defs>
          <marker id="arrowheadStudent" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto">
            <polygon points="0 0, 14 5, 0 10" fill="#FFB7C5" stroke="none"/>
          </marker>
        </defs>

        <!-- Edges (curved slightly so the graph looks clean and uncluttered) -->
        <!-- PreviousPerformance → Understanding -->
        <path d="M 150 90 Q 215 70 280 115" fill="none"
              stroke="#FFB7C5" stroke-width="3" marker-end="url(#arrowheadStudent)" />

        <!-- StudyHours → Understanding -->
        <path d="M 150 185 Q 210 165 280 145" fill="none"
              stroke="#FFB7C5" stroke-width="3" marker-end="url(#arrowheadStudent)" />

        <!-- Attendance → Understanding -->
        <path d="M 150 255 Q 215 220 285 170" fill="none"
              stroke="#FFB7C5" stroke-width="3" marker-end="url(#arrowheadStudent)" />

        <!-- Understanding → Grade -->
        <path d="M 360 160 Q 395 180 415 210" fill="none"
              stroke="#FFB7C5" stroke-width="3" marker-end="url(#arrowheadStudent)" />

        <!-- Attendance → Grade -->
        <path d="M 150 280 Q 260 305 405 245" fill="none"
              stroke="#FFB7C5" stroke-width="3" marker-end="url(#arrowheadStudent)" />
      </svg>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
